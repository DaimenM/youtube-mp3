services:
  - type: web
    name: youtube-mp3-worker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: MAX_QUEUE_DEPTH
        value: "25"
      - key: MAX_PLAYLIST_TRACKS
        value: "50"
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: WORKER_API_SECRET
        generateValue: true
      - key: MY_COOKIES
        sync: false
